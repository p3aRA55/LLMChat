<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>AzChat — AI Chat</title>
<script>
(function(){try{
  var mode=localStorage.getItem("azchat_theme_mode")||"system";
  var resolved=mode==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):mode;
  document.documentElement.dataset.theme=resolved;
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --r-sm:10px;--r-md:15px;--r-lg:21px;--ease:cubic-bezier(.16,.84,.44,1);
  --sidebar:272px;--content:820px;
}
:root,[data-theme="dark"]{
  --bg:#08090d;--panel:#0e1016;--panel2:#12151d;--glass:rgba(255,255,255,.045);
  --glass2:rgba(255,255,255,.075);--border:rgba(255,255,255,.09);--soft:rgba(255,255,255,.055);
  --text:#eef0f6;--dim:#a5a9b9;--muted:#6f7485;--accent:#7d7fff;--accent2:#9c8fff;
  --danger:#ff6f7d;--user:linear-gradient(145deg,#686cf1,#5047d5);--shadow:rgba(0,0,0,.48);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f3f4f7;--panel:#fff;--panel2:#f8f8fb;--glass:rgba(255,255,255,.72);
  --glass2:rgba(255,255,255,.9);--border:rgba(20,20,35,.09);--soft:rgba(20,20,35,.055);
  --text:#171820;--dim:#55596b;--muted:#898d9e;--accent:#5c55df;--accent2:#7169e9;
  --danger:#d94e5c;--user:linear-gradient(145deg,#6862e9,#5148d6);--shadow:rgba(30,30,60,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Vazirmatn","Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,textarea{font:inherit}
button{color:inherit}
.field{position:fixed;inset:0;pointer-events:none;z-index:0;background:
 radial-gradient(55% 45% at 12% 5%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
 radial-gradient(45% 40% at 92% 8%,color-mix(in srgb,#d5a95d 9%,transparent),transparent 70%),
 radial-gradient(65% 55% at 50% 100%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%)}
.app{height:100%;display:flex;position:relative;z-index:1}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);border-right:1px solid var(--border);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(24px);display:flex;flex-direction:column;padding:15px 12px;gap:12px;transition:transform .3s var(--ease)}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:2px 5px 10px}
.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:31px;height:31px;border-radius:10px;background:linear-gradient(145deg,var(--accent),#c4a15e);box-shadow:0 7px 20px -9px var(--accent)}
.brand h1{font-size:15px;margin:0;font-weight:800}.brand small{display:block;color:var(--muted);font-size:9px;font-weight:500;margin-top:1px}
.icon-btn,.new-chat,.history-item{border:1px solid transparent;background:transparent;cursor:pointer}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--dim)}
.icon-btn:hover,.history-item:hover{background:var(--glass);border-color:var(--border)}
.new-chat{height:43px;border-radius:13px;background:var(--glass2);border-color:var(--border);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;transition:.2s}
.new-chat:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));transform:translateY(-1px)}
.history-label{font-size:10px;color:var(--muted);padding:8px 8px 2px;font-weight:700}
.history{overflow:auto;display:flex;flex-direction:column;gap:4px;flex:1}
.source-list{max-height:110px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.source-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 8px;color:var(--dim);font-size:10px}
.source-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.source-item button{border:0;background:transparent;color:var(--muted);cursor:pointer}
.history-item{width:100%;text-align:left;padding:10px 11px;border-radius:11px;display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px}
.history-item.active{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 25%,var(--border));color:var(--text)}
.history-item .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.history-item .delete{opacity:0;font-size:13px;color:var(--muted)}.history-item:hover .delete{opacity:1}
.sidebar-foot{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.theme-row{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.theme-row>span{font-size:11px;color:var(--dim);font-weight:600}
.theme-switch{display:flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:3px}
.theme-switch button{width:28px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);border:0;background:transparent;cursor:pointer;transition:.15s}
.theme-switch button svg{width:14px;height:14px;display:block}
.theme-switch button.active{background:var(--panel);color:var(--text);box-shadow:0 1px 5px var(--shadow)}
.theme-switch button:hover:not(.active){color:var(--text)}
#clearBtn{height:36px;border-radius:10px;font-size:11px;color:var(--dim);border:1px solid transparent;background:transparent;cursor:pointer}
#clearBtn:hover{background:var(--glass);border-color:var(--border)}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{height:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:center;padding:10px 18px}
.topbar-inner{width:100%;max-width:var(--content);display:flex;align-items:center;justify-content:space-between}
.mobile-menu{display:none}.model{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.model-dot{width:7px;height:7px;border-radius:50%;background:#6ee7a0;box-shadow:0 0 12px #6ee7a0}
.top-actions{display:flex;gap:6px}
.upload-btn{height:34px;padding:0 11px;border:1px solid var(--border);border-radius:10px;background:var(--glass);font-size:11px;cursor:pointer}
.upload-btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
.chat-wrap{min-height:0;flex:1;display:flex;justify-content:center}
#chat{width:100%;max-width:var(--content);overflow-y:auto;padding:18px 18px 120px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;max-width:500px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,var(--accent),#b89456);display:grid;place-items:center;box-shadow:0 18px 45px -20px var(--accent)}
.empty h2{margin:4px 0 0;font-size:25px;letter-spacing:-.5px}.empty p{margin:0;color:var(--muted);font-size:12.5px}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;width:min(100%,460px)}
.suggestion{padding:11px;text-align:left;border:1px solid var(--border);background:var(--glass);border-radius:12px;color:var(--dim);font-size:11px;cursor:pointer}.suggestion:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--text)}
.msg-row{display:flex;flex-direction:column;max-width:88%;animation:appear .25s var(--ease)}
.msg-row.user-row{align-self:flex-end;align-items:flex-end}.msg-row.bot-row{align-self:flex-start;align-items:flex-start}
.msg{padding:12px 15px;border-radius:17px;line-height:1.85;font-size:14px;white-space:pre-wrap;word-break:break-word}
.user{background:var(--user);color:white;border-bottom-right-radius:5px;box-shadow:0 9px 25px -15px var(--accent)}
.bot{background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(16px);border-bottom-left-radius:5px;min-width:50px}
.msg-actions{display:flex;gap:3px;opacity:0;transition:.2s;margin-top:4px}.msg-row:hover .msg-actions,.msg-actions:focus-within{opacity:1}
.msg-actions button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:4px 7px;border-radius:7px;cursor:pointer}.msg-actions button:hover{background:var(--glass);color:var(--text)}
.typing-dots{display:flex;gap:4px;padding:4px 1px}.typing-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:dot 1s infinite}.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.bot p{margin:.45em 0}.bot p:first-child{margin-top:0}.bot p:last-child{margin-bottom:0}.bot strong{font-weight:800}
.cited-sources{display:flex;flex-wrap:wrap;gap:6px;margin:5px 2px 0;color:var(--muted);font-size:10px}
.cited-sources span{border:1px solid var(--border);border-radius:7px;padding:2px 6px}
.bot code{font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--soft);padding:2px 5px;border-radius:5px;direction:ltr;unicode-bidi:plaintext}
.code-wrap{direction:ltr;text-align:left;margin:10px 0;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:rgba(0,0,0,.18)}
.code-head{height:31px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid var(--border);color:var(--muted);font:10px "JetBrains Mono",monospace}
.code-head button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:10px}.code-wrap pre{margin:0;padding:12px;overflow:auto;font:12px/1.65 "JetBrains Mono",monospace;color:var(--text);white-space:pre}
.composer-area{position:relative;z-index:4;display:flex;justify-content:center;padding:0 18px max(14px,env(safe-area-inset-bottom))}
.composer{width:100%;max-width:var(--content);background:var(--glass2);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--border);border-radius:18px;box-shadow:0 18px 45px -22px var(--shadow);padding:9px 10px 9px 13px;display:flex;align-items:flex-end;gap:8px}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:0 18px 45px -22px var(--shadow),0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
#input{flex:1;resize:none;max-height:170px;min-height:38px;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;line-height:1.65;padding:7px 3px}
#input::placeholder{color:var(--muted)}
.send{width:39px;height:39px;flex:0 0 39px;border:0;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;cursor:pointer;transition:.18s;box-shadow:0 8px 18px -9px var(--accent)}
.send:hover:not(:disabled){transform:translateY(-1px)}.send:active:not(:disabled){transform:scale(.93)}.send:disabled{opacity:.38;cursor:not-allowed}
.composer-hint{max-width:var(--content);width:100%;position:absolute;bottom:2px;transform:translateY(100%);text-align:center;font-size:9px;color:var(--muted);padding-top:4px}
.backdrop{display:none}
@media(max-width:760px){
 .sidebar{position:fixed;z-index:10;inset:0 auto 0 0;transform:translateX(-105%);box-shadow:20px 0 50px -25px var(--shadow)}
 .sidebar.open{transform:translateX(0)}.backdrop{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}.backdrop.show{display:block}
 .mobile-menu{display:grid}.topbar{height:58px;flex-basis:58px;padding:8px 12px}.topbar-inner{gap:8px}
 #chat{padding:10px 12px 110px}.msg-row{max-width:94%}.msg{font-size:13.5px}.suggestions{grid-template-columns:1fr}
 .composer-area{padding:0 10px max(10px,env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="field"></div><div class="backdrop" id="backdrop"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head"><div class="brand"><span class="brand-mark"></span><div><h1>AzChat</h1><small>AI workspace</small></div></div><button class="icon-btn" id="closeSidebar" aria-label="Close">×</button></div>
  <button class="new-chat" id="newChat">＋ New chat</button>
  <div class="history-label">Chats</div><div class="history" id="history"></div>
  <div class="history-label">Documents</div><div class="source-list" id="sourceList"></div>
  <div class="sidebar-foot">
    <div class="theme-row">
      <span>Theme</span>
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="Theme">
        <button data-theme-choice="system" aria-label="System theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
        <button data-theme-choice="light" aria-label="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
        <button data-theme-choice="dark" aria-label="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      </div>
    </div>
    <button id="clearBtn">Clear history</button>
  </div>
</aside>
<section class="main">
  <header class="topbar"><div class="topbar-inner">
    <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Menu">☰</button>
    <div class="model"><span class="model-dot"></span><span>AzChat · AI</span><span id="stats"></span></div>
    <div class="top-actions"><button class="upload-btn" id="uploadBtn">Upload document</button><input id="uploadInput" type="file" accept=".txt,.md,text/plain,text/markdown" hidden></div>
  </div></header>
  <div class="chat-wrap"><main id="chat">
    <div class="empty" id="empty">
      <div class="empty-logo">✦</div><h2>How can I help you today?</h2><p>Ask a question, write code, brainstorm ideas, or work on your project.</p>
      <div class="suggestions"><button class="suggestion">Suggest an AI project idea</button><button class="suggestion">Explain this code to me</button><button class="suggestion">Build me a study plan</button><button class="suggestion">Help me solve a hard problem</button></div>
    </div>
  </main></div>
  <div class="composer-area"><div class="composer">
    <textarea id="input" rows="1" dir="auto" placeholder="Message AzChat..."></textarea>
    <button class="send" id="sendBtn" aria-label="Send" disabled>➤</button>
  </div><div class="composer-hint">Enter to send · Shift + Enter for new line</div></div>
</section>
</div>
<script>
const $=s=>document.querySelector(s), chat=$("#chat"), input=$("#input"), send=$("#sendBtn"), stats=$("#stats");
let sessionId=null, currentChatId=null, chats=[];
try{sessionId=localStorage.getItem("azchat_session");chats=JSON.parse(localStorage.getItem("azchat_chats")||"[]")}catch{}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){try{localStorage.setItem("azchat_chats",JSON.stringify(chats));if(sessionId)localStorage.setItem("azchat_session",sessionId)}catch{}}
function escape(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function markdown(s){
  let x=escape(s), blocks=[];
  x=x.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{let id="§§"+blocks.length+"§§";blocks.push(`<div class="code-wrap"><div class="code-head"><span>${lang||"code"}</span><button onclick="copyCode(this)">Copy</button></div><pre>${code.trim()}</pre></div>`);return id});
  x=x.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  x=x.split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
  blocks.forEach((b,i)=>x=x.replace("§§"+i+"§§",b));return x;
}
window.copyCode=async btn=>{const code=btn.closest(".code-wrap").querySelector("pre").innerText;try{await navigator.clipboard.writeText(code);btn.textContent="Copied";setTimeout(()=>btn.textContent="Copy",1200)}catch{}};
function renderHistory(){
  const h=$("#history");h.innerHTML="";
  [...chats].reverse().forEach(c=>{const el=document.createElement("button");el.className="history-item"+(c.id===currentChatId?" active":"");el.innerHTML=`<span>◌</span><span class="title">${escape(c.title||"New chat")}</span><span class="delete" title="Delete">×</span>`;
    el.onclick=e=>{if(e.target.classList.contains("delete")){chats=chats.filter(x=>x.id!==c.id);if(currentChatId===c.id)newChat();save();renderHistory();return}loadChat(c.id)};h.appendChild(el)});
}
function ensureChat(title="New chat"){if(!currentChatId){currentChatId=uid();chats.push({id:currentChatId,title,messages:[]});save();renderHistory()}}
function newChat(){currentChatId=null;sessionId=null;chat.innerHTML=`<div class="empty" id="empty"><div class="empty-logo">✦</div><h2>How can I help you today?</h2><p>Ask a question, write code, brainstorm ideas, or work on your project.</p><div class="suggestions">${["Suggest an AI project idea","Explain this code to me","Build me a study plan","Help me solve a hard problem"].map(x=>`<button class="suggestion">${x}</button>`).join("")}</div></div>`;bindSuggestions();input.focus();renderHistory()}
function loadChat(id){const c=chats.find(x=>x.id===id);if(!c)return;currentChatId=id;chat.innerHTML="";c.messages.forEach(m=>addMessage(m.role,m.text,false));renderHistory();input.focus()}
function addMessage(role,text,saveMsg=true){
 $("#empty")?.remove();const row=document.createElement("div");row.className="msg-row "+(role==="user"?"user-row":"bot-row");
 const bubble=document.createElement("div");bubble.className="msg "+role;
 bubble.setAttribute("dir","auto");
 if(role==="bot"){bubble.innerHTML=markdown(text)}else bubble.textContent=text;
 row.appendChild(bubble);
 if(role==="bot"){const actions=document.createElement("div");actions.className="msg-actions";actions.innerHTML=`<button onclick="copyMsg(this)">Copy</button><button onclick="retryLast()">Retry</button>`;row.appendChild(actions)}
 chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
 if(saveMsg){ensureChat(text.slice(0,42)||"New chat");let c=chats.find(x=>x.id===currentChatId);if(c){c.messages.push({role,text});if(c.messages.length===1)c.title=text.slice(0,42);save();renderHistory()}}
 return bubble;
}
window.copyMsg=async b=>{const t=b.closest(".msg-row").querySelector(".msg").innerText;try{await navigator.clipboard.writeText(t);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)}catch{}};
window.retryLast=()=>{const c=chats.find(x=>x.id===currentChatId);if(!c)return;const last=c.messages.filter(m=>m.role==="user").pop();if(last){input.value=last.text;sendMessage()}};
async function refreshStats(){if(!sessionId)return;try{const r=await fetch(`/report/${sessionId}`),d=await r.json();if(d.total_tokens!==undefined)stats.textContent=` · ${d.total_tokens.toLocaleString()} tokens · $${Number(d.estimated_cost_usd||0).toFixed(6)}`}catch{}}
async function refreshSources(){
 const response=await fetch("/rag/sources");if(!response.ok)throw new Error("Could not load document sources");
 const data=await response.json(),list=$("#sourceList");list.innerHTML="";
 Object.entries(data.sources||{}).forEach(([name,count])=>{
  const item=document.createElement("div");item.className="source-item";
  const label=document.createElement("span");label.textContent=`${name} · ${count}`;
  const remove=document.createElement("button");remove.type="button";remove.textContent="×";remove.title="Remove document";
  remove.onclick=async()=>{const result=await fetch(`/rag/sources/${encodeURIComponent(name)}`,{method:"DELETE"});if(result.ok)await refreshSources()};
  item.append(label,remove);list.appendChild(item);
 });
}
function renderSources(bubble,sources){
 if(!Array.isArray(sources)||!sources.length)return;
 const list=document.createElement("div");list.className="cited-sources";
 sources.forEach((source,index)=>{const label=document.createElement("span");label.textContent=`[${index+1}] ${source.source}`;list.appendChild(label)});
 bubble.closest(".msg-row").appendChild(list);
}
async function sendMessage(){
 const text=input.value.trim();if(!text||send.disabled)return;input.value="";resize();send.disabled=true;ensureChat(text.slice(0,42));
 addMessage("user",text);const bot=addMessage("bot","",false);bot.innerHTML='<div class="typing-dots"><i></i><i></i><i></i></div>';
 try{
  const res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId,message:text})});
  if(!res.ok)throw new Error("HTTP "+res.status);const reader=res.body.getReader(),decoder=new TextDecoder();let buffer="",full="";
  bot.innerHTML="";let citedSources=[];
  while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split("\n\n");buffer=events.pop();
   for(const evt of events){let type="message",data="";evt.split("\n").forEach(line=>{if(line.startsWith("event:"))type=line.slice(6).trim();if(line.startsWith("data:"))data=line.slice(5).trim()});
    if(type==="session"){sessionId=data;save()}else if(type==="sources"){citedSources=JSON.parse(data)}else if(type==="done"){bot.innerHTML=markdown(full);renderSources(bot,citedSources);refreshStats()}else{full+=data.replace(/\\n/g,"\n");bot.textContent=full;chat.scrollTop=chat.scrollHeight}
   }
  }
  bot.innerHTML=markdown(full);let c=chats.find(x=>x.id===currentChatId);if(c){c.messages.push({role:"bot",text:full});save()}
 }catch(e){bot.textContent="Couldn't reach the server. Check that the backend and the /chat endpoint are running.";bot.style.borderColor="color-mix(in srgb,var(--danger) 50%,var(--border))"}
 finally{send.disabled=!input.value.trim();input.focus()}
}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,170)+"px";send.disabled=!input.value.trim()}
function bindSuggestions(){$$(".suggestion")&&document.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{input.value=b.textContent;resize();input.focus()})}
const themeSwitch=$("#themeSwitch");
function resolveTheme(mode){return mode==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):mode}
function applyThemeMode(mode){
  document.documentElement.dataset.theme=resolveTheme(mode);
  themeSwitch?.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.themeChoice===mode));
  try{localStorage.setItem("azchat_theme_mode",mode)}catch{}
}
let themeMode="system";
try{themeMode=localStorage.getItem("azchat_theme_mode")||"system"}catch{}
applyThemeMode(themeMode);
themeSwitch?.querySelectorAll("button").forEach(b=>b.onclick=()=>applyThemeMode(b.dataset.themeChoice));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{try{if((localStorage.getItem("azchat_theme_mode")||"system")==="system")applyThemeMode("system")}catch{}});
$("#clearBtn").onclick=()=>{if(confirm("Clear all chat history?")){chats=[];currentChatId=null;save();newChat()}};
$("#newChat").onclick=newChat;$("#menuBtn").onclick=()=>{$("#sidebar").classList.add("open");$("#backdrop").classList.add("show")};$("#closeSidebar").onclick=()=>{$("#sidebar").classList.remove("open");$("#backdrop").classList.remove("show")};$("#backdrop").onclick=$("#closeSidebar").onclick;
send.onclick=sendMessage;input.addEventListener("input",resize);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
$("#uploadBtn").onclick=()=>$("#uploadInput").click();
$("#uploadInput").addEventListener("change",async event=>{
 const file=event.target.files[0];if(!file)return;
 const form=new FormData();form.append("file",file);
 try{const response=await fetch("/rag/upload",{method:"POST",body:form});const result=await response.json();if(!response.ok)throw new Error(result.detail||"Upload failed");await refreshSources();alert(`Uploaded ${result.source} (${result.chunks} chunks)`)}
 catch(error){alert(error.message||"Upload failed")}
 finally{event.target.value=""}
});
refreshSources().catch(()=>{});
bindSuggestions();renderHistory();
if(chats.length&&sessionId){const c=chats.find(x=>x.id===currentChatId)||chats[0];loadChat(c.id)}
</script>
</body>
