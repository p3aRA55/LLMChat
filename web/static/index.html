<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzChat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8a90a2;
    --accent: #5b8cff;
    --user-bubble: #2a3550;
    --bot-bubble: #1d2129;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  #stats {
    font-size: 12px;
    color: var(--muted);
    direction: ltr;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bot.typing::after {
    content: "▍";
    animation: blink 1s step-start infinite;
    color: var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }
  #inputBar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #inputBar textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 140px;
  }
  #inputBar button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #inputBar button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>AzChat</h1>
  <span id="stats">tokens: 0</span>
</header>

<div id="chat"></div>

<div id="inputBar">
  <textarea id="input" rows="1" placeholder="پیامت رو بنویس..."></textarea>
  <button id="sendBtn">ارسال</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statsEl = document.getElementById('stats');

let sessionId = localStorage.getItem('azchat_session') || null;

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function refreshStats() {
  if (!sessionId) return;
  try {
    const res = await fetch(`/report/${sessionId}`);
    const data = await res.json();
    if (data.total_tokens !== undefined) {
      statsEl.textContent = `tokens: ${data.total_tokens} | cost: $${data.estimated_cost_usd.toFixed(6)}`;
    }
  } catch (e) { /* ignore */ }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage('user', text);
  const botDiv = addMessage('bot', '');
  botDiv.classList.add('typing');

  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message: text })
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const events = buffer.split('\n\n');
    buffer = events.pop(); // keep incomplete tail

    for (const evt of events) {
      const lines = evt.split('\n');
      let eventType = 'message';
      let data = '';
      for (const line of lines) {
        if (line.startsWith('event:')) eventType = line.slice(6).trim();
        if (line.startsWith('data:')) data = line.slice(5).trim();
      }

      if (eventType === 'session') {
        sessionId = data;
        localStorage.setItem('azchat_session', sessionId);
      } else if (eventType === 'done') {
        botDiv.classList.remove('typing');
        refreshStats();
      } else {
        botDiv.textContent += data.replace(/\\n/g, '\n');
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = inputEl.scrollHeight + 'px';
});
</script>

</body>
</html>
